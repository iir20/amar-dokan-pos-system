
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#10b981" />
    <title>Amar Dokan POS</title>
    <meta name="description" content="Offline-first POS system for Bangladeshi businesses">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', 'Hind Siliguri', sans-serif;
        background-color: #f8fafc;
        margin: 0;
        overscroll-behavior-y: none;
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      /* Global Animations */
      @keyframes fade-in {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      @keyframes slide-up {
        from { transform: translateY(20px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
      }
      @keyframes scale-in {
        from { transform: scale(0.95); opacity: 0; }
        to { transform: scale(1); opacity: 1; }
      }
      
      .animate-fade-in { animation: fade-in 0.5s ease-out forwards; }
      .animate-slide-up { animation: slide-up 0.5s ease-out forwards; }
      .animate-scale-in { animation: scale-in 0.3s ease-out forwards; }

      /* Immersive Initial Loader */
      .loader-container {
        position: fixed;
        inset: 0;
        background: linear-gradient(135deg, #f0fdf4 0%, #ffffff 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
      }

      .loader-logo-wrap {
        position: relative;
        width: 100px;
        height: 100px;
        margin-bottom: 2rem;
        animation: float 3s ease-in-out infinite;
      }

      .loader-logo {
        width: 100%;
        height: 100%;
        object-fit: contain;
        filter: drop-shadow(0 10px 15px rgba(16, 185, 129, 0.2));
      }

      .loader-pulse {
        position: absolute;
        inset: -20px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(16, 185, 129, 0.2) 0%, transparent 70%);
        animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
      }

      .loader-text {
        font-family: 'Hind Siliguri', sans-serif;
        font-weight: 700;
        font-size: 1.5rem;
        background: linear-gradient(to right, #059669, #10b981);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        letter-spacing: 0.05em;
        opacity: 0;
        animation: fade-in 1s ease-out 0.5s forwards;
      }

      .loader-bar-bg {
        width: 140px;
        height: 4px;
        background: #e2e8f0;
        border-radius: 2px;
        margin-top: 1rem;
        overflow: hidden;
      }
      
      .loader-bar-fill {
        height: 100%;
        width: 50%;
        background: #10b981;
        border-radius: 2px;
        animation: progress 1.5s infinite ease-in-out;
      }

      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
      }

      @keyframes pulse-ring {
        0% { transform: scale(0.5); opacity: 0; }
        50% { opacity: 1; }
        100% { transform: scale(1.5); opacity: 0; }
      }

      @keyframes progress {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(200%); }
      }
    </style>
</head>
  <body>
    <div id="root">
      <!-- Immersive Loader visible before React loads -->
      <div class="loader-container">
        <div class="loader-logo-wrap">
          <div class="loader-pulse"></div>
          <img src="/favicon.svg" alt="Amar Dokan" class="loader-logo">
        </div>
        <div class="loader-text">Amar Dokan</div>
        <div class="loader-bar-bg">
          <div class="loader-bar-fill"></div>
        </div>
      </div>
    </div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
