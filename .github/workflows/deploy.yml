name: Deploy to Render

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-and-deploy:
    name: Build, Verify & Trigger Render Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Phase 2 fix: `npm ci` cannot work — there is no package-lock.json
      # (bun.lock is the lockfile). `npm install` resolves without one.
      - name: Install dependencies
        run: npm install

      - name: Type-check
        run: npx tsc --noEmit

      # Phase 6: lint joins the deploy gate (same command as ci.yml).
      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Build client
        run: npm run build
        env:
          NODE_ENV: production

      - name: Trigger Render deploy
        if: ${{ success() }}
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "::error::RENDER_DEPLOY_HOOK_URL secret is not set. Add it in GitHub repo Settings > Secrets and variables > Actions. See README.md 'Deployment' section for setup steps."
            exit 1
          fi
          curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
